name: Pull Official SubConverter and Push to GHCR

on:
  # 🚨 已经删除了定时任务和代码推送触发，现在【仅支持手动触发】
  workflow_dispatch:

env:
  # 💡 核心修复：原作者名字后缀是 233，补齐了最后缺少的 3
  OFFICIAL_IMAGE: asdlokj1qpi23/subconverter
  REGISTRY: ghcr.io
  OWNER: djkyc                # 您的 GitHub 用户名
  REPO: subconverter          # 您的仓库名

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull official image
        run: docker pull ${{ env.OFFICIAL_IMAGE }}

      - name: Tag for GHCR
        run: |
          docker tag ${{ env.OFFICIAL_IMAGE }} ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:latest
          docker tag ${{ env.OFFICIAL_IMAGE }} ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:$(date +%Y%m%d)

      - name: Push to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:$(date +%Y%m%d)
