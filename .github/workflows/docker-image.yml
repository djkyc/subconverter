name: Pull Official SubConverter and Push to GHCR

on:
  workflow_dispatch:          # 手动触发
  schedule:
    - cron: '0 0 * * 0'       # 可选：每周同步一次官方最新版本
  push:
    branches: [ master, main ] # 可选：当您修改 Dockerfile 时自动构建

env:
  OFFICIAL_IMAGE: tindy2013/subconverter:latest
  REGISTRY: ghcr.io
  OWNER: djkyc                # 改为您的 GitHub 用户名
  REPO: subconverter          # 改为您的仓库名

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (only needed if you have custom files)
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull official image
        run: docker pull ${{ env.OFFICIAL_IMAGE }}

      - name: Tag for GHCR
        run: |
          docker tag ${{ env.OFFICIAL_IMAGE }} ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:latest
          # 如果官方镜像有版本标签，也可以同步过来（可选）
          docker tag ${{ env.OFFICIAL_IMAGE }} ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:$(date +%Y%m%d)

      - name: Push to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}:$(date +%Y%m%d)
