name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [ master, main ]   # 当你推送代码到 master 或 main 分支时触发
    tags: [ 'v*.*.*' ]          # 或者当你推送一个形如 v1.2.3 的标签时触发
  workflow_dispatch:            # 也支持从 GitHub 网页上手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # 镜像名会自动设为你的 GitHub 用户名/仓库名

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # 允许向 ghcr.io 推送镜像

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # 拉取你的仓库代码

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub 会自动提供这个 Token

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
