name: Build and Push Multi-Arch Docker Image to GHCR

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
  # 当“Sync with Upstream”工作流运行成功时，自动触发此工作流
  workflow_run:
    workflows: ["Sync with Upstream"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 只有在正常的 push、手动触发，或者同步上游成功时才执行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          # 🚨【注意】如果你的 Dockerfile 名字叫 Dockerfile.alpine，请把下面这行改成 ./Dockerfile.alpine
          file: ./Dockerfile
          # 🚀【全架构支持】严格指定三个主流架构：电脑、N1盒子(arm64)、老路由(armv7)
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 💡【新增优化】清理编译缓存，防止多架构并发时交叉污染
          cache-from: type=gha
          cache-to: type=gha,mode=max
