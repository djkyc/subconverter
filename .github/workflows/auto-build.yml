name: Sync Upstream Image

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  SOURCE_IMAGE: asdlokj1qpi23/subconverter:latest
  TARGET_REGISTRY: ghcr.io
  TARGET_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Install skopeo and jq
        run: sudo apt-get update && sudo apt-get install -y skopeo jq

      - name: Get upstream digest
        id: upstream
        run: |
          UPSTREAM_DIGEST=$(skopeo inspect --raw docker://${{ env.SOURCE_IMAGE }} | jq -r '.manifests[0].digest')
          echo "digest=$UPSTREAM_DIGEST" >> $GITHUB_OUTPUT

      - name: Get current target digest
        id: target
        run: |
          # 如果目标镜像不存在，digest 为空
          set +e
          TARGET_DIGEST=$(skopeo inspect --raw docker://${{ env.TARGET_IMAGE }}:latest 2>/dev/null | jq -r '.manifests[0].digest')
          set -e
          echo "digest=$TARGET_DIGEST" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        if: steps.upstream.outputs.digest != steps.target.outputs.digest
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TARGET_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy multi-arch image
        if: steps.upstream.outputs.digest != steps.target.outputs.digest
        run: |
          skopeo copy --all \
            docker://${{ env.SOURCE_IMAGE }} \
            docker://${{ env.TARGET_IMAGE }}:latest

          DATE_TAG=$(date +%Y%m%d)
          skopeo copy --all \
            docker://${{ env.SOURCE_IMAGE }} \
            docker://${{ env.TARGET_IMAGE }}:$DATE_TAG

      - name: No update needed
        if: steps.upstream.outputs.digest == steps.target.outputs.digest
        run: echo "Upstream image has not changed, skipping copy."
